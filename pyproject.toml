[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "counterfraud-gnn"
version = "0.1.0"
description = "Counterfactual Temporal Graph Neural Network for Invariant Fraud Detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Chrisolande", email = "olandechris@outlook.com" },
]
keywords = [
    "graph-neural-networks",
    "fraud-detection",
    "counterfactual-learning",
    "temporal-graphs",
    "causal-inference",
    "pytorch-lightning",
    "invariant-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "feature-engine>=1.9.4",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pytorch-lightning>=2.0.0",
    "scikit-learn>=1.3.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.0.0",
    "torch-geometric>=2.4.0",
    "torchmetrics>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]
notebooks = [
    "jupyterlab>=4.0.0",
    "matplotlib>=3.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
counterfraud = "main:main"
counterfraud-train = "main:main"

[project.urls]
Homepage = "https://github.com/Chrisolande/CounterFraud-GNN"
Repository = "https://github.com/Chrisolande/CounterFraud-GNN"
"Issue Tracker" = "https://github.com/Chrisolande/CounterFraud-GNN/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["counterfraud*"]

[tool.setuptools]
py-modules = ["main", "train_multi_seeds"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]
